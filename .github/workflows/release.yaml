name: "Release dev container templates"

# Publishing is normally done locally with `make release`, so this never fires
# on its own. It is the fallback for when a release has to go out from
# somewhere without credentials to hand.
#
# There is no tag trigger on purpose: a version belongs to a template, not to
# the repository. One repo tag cannot express "ubuntu 1.2.0 and rohd 0.3.1".
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: "Publish Templates"
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
          # README.md under src/<id> is generated, but `make prepare` already
          # runs `make docs` before the version is committed, so it is current
          # by the time anything is published. Regenerating here would only
          # produce a diff nobody commits back.
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
