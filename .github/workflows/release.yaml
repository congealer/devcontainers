name: "Release dev container templates"

# Publishing is normally done locally with `make release`, so this never fires
# on its own. It is the fallback for when a release has to go out from
# somewhere without credentials to hand.
#
# There is no tag trigger on purpose: a version belongs to a template, not to
# the repository. One repo tag cannot express "ubuntu 1.2.0 and rohd 0.3.1".
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Fetched in full: release-check reads the history to tell whether a
      # template moved on since its version was committed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # `make release` rather than devcontainers/action@v1, which wraps the same
      # CLI: one publish path, and it goes through release-check. gh is
      # preinstalled on the runner and reads GH_TOKEN, so `gh auth token` in the
      # target works without a login step.
      #
      # generate-docs has no equivalent here and needs none -- `make prepare`
      # regenerates the README before the version is committed, so it is already
      # current by the time anything is published.
      - name: "Publish templates"
        run: make release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
