name: rohd_patches
description: Workarounds for open ROHD issues. One file per issue, so each can
  be deleted independently once upstream lands a fix.
version: 0.1.0
publish_to: none

# Resolved together with the root package: one lockfile, one .dart_tool.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  rohd: ^0.6.9

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
