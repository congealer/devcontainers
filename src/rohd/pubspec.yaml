name: ${templateOption:projectName}
description: ${templateOption:description}
version: 1.0.0

environment:
  sdk: ^3.12.2

# The patches live in their own package so they can move to a separate repo
# later without touching a single import. `any` because a workspace member's
# version comes from its local source.
workspace:
  - packages/rohd_patches

# Add regular dependencies here.
dependencies:
  rohd: ^0.6.9
  rohd_patches: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
